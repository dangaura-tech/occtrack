[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "occtrack"
version = "0.3.0"
description = "Occlusion-aware multi-object tracking by detection"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Dang Truong Minh Le", email = "dang.le@mbzuai.ac.ae" }]
dependencies = ["numpy>=1.24", "scipy>=1.10", "PyYAML>=6.0"]

[project.scripts]
occtrack-mot = "occtrack.cli:track_mot"
occtrack-eval = "occtrack.cli:eval_mot"
occtrack-ablation = "occtrack.cli:simulate_ablation"

[project.optional-dependencies]
video = ["ultralytics>=8.1", "opencv-python>=4.8"]
cmc = ["opencv-python-headless>=4.8"]
reid = ["torch>=2.1", "torchvision>=0.16"]
openvocab = ["torch>=2.1", "transformers>=4.40", "opencv-python>=4.8"]
dev = ["pytest>=7", "ruff", "opencv-python-headless>=4.8"]

[tool.setuptools.packages.find]
include = ["occtrack*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
